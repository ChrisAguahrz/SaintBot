name: Saint Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pywikibot
      
      - name: Create user config
        run: |
          echo 'usernames["wikipedia"]["sw"] = "Gayle-Bot"' > user-config.py
          echo 'family = "wikipedia"' >> user-config.py
          echo 'mylang = "sw"' >> user-config.py
      
      - name: Run saint bot
        run: python saint_bot.py
        env:
          PYWIKIBOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
